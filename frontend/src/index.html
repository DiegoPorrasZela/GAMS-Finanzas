<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>GAMS Finanzas</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Controla tus ingresos y gastos, define tu presupuesto mensual y ahorra para tus metas."
    />
    <!-- Color de la barra del navegador en el celular (igual que la barra de navegación) -->
    <meta name="theme-color" content="#111827" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />

    <!-- App instalable (PWA): nombre, colores e íconos para la pantalla de inicio -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="GAMS" />

    <!-- Tipografía de la marca: Inter (legible en pantallas y con números del mismo ancho) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <!-- tabular-nums: todos los dígitos ocupan el mismo ancho, así los montos quedan alineados -->
  <body class="bg-gray-50 text-gray-900 antialiased tabular-nums">
    <app-root></app-root>
  </body>
</html>
