<header class="sticky top-0 z-10 bg-gray-900 shadow-md">
  <nav
    class="max-w-6xl mx-auto flex flex-col gap-3 px-4 py-3 sm:flex-row sm:items-center sm:justify-between"
  >
    <a routerLink="/" class="text-xl font-bold text-white">
      <span class="text-green-500">GAMS</span> Finanzas
    </a>
    <div class="flex flex-wrap gap-2">
      @for (enlace of enlaces; track enlace.ruta) {
        <a
          [routerLink]="enlace.ruta"
          routerLinkActive="bg-green-600! text-white!"
          [routerLinkActiveOptions]="{ exact: enlace.exacto }"
          ariaCurrentWhenActive="page"
          class="px-3 py-2 rounded-md text-sm font-medium text-gray-300 hover:bg-gray-800 hover:text-white transition-colors"
          >{{ enlace.texto }}</a
        >
      }
    </div>
  </nav>
</header>

<main class="max-w-6xl mx-auto px-4 py-8">
  <router-outlet></router-outlet>
</main>
