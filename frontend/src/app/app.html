<header class="sticky top-0 z-10 bg-gray-900 shadow-md">
  <nav
    class="max-w-6xl mx-auto flex flex-col gap-3 px-4 py-3 lg:flex-row lg:items-center lg:justify-between"
  >
    <a routerLink="/" class="flex items-center gap-2.5 text-xl font-bold tracking-tight text-white">
      <app-logo class="size-8" />
      <span><span class="text-green-500">GAMS</span> Finanzas</span>
    </a>

    <!-- Con sesión, en celular y tablet estos enlaces van en la barra inferior (app-navegacion-movil) -->
    <div class="flex-wrap gap-2 lg:flex" [class.hidden]="usuario()" [class.flex]="!usuario()">
      @for (enlace of enlaces(); track enlace.ruta) {
        <a
          [routerLink]="enlace.ruta"
          routerLinkActive="bg-green-600! text-white!"
          [routerLinkActiveOptions]="{ exact: enlace.exacto }"
          ariaCurrentWhenActive="page"
          class="px-3 py-2 rounded-md text-sm font-medium text-gray-300 hover:bg-gray-800 hover:text-white transition-colors"
          >{{ enlace.texto }}</a
        >
      }
    </div>

    <!-- Sesión -->
    <div class="items-center gap-3 text-sm lg:flex" [class.hidden]="usuario()" [class.flex]="!usuario()">
      @if (usuario(); as usuario) {
        @if (sePuedeInstalar()) {
          <button
            type="button"
            (click)="instalar()"
            title="Instalar GAMS Finanzas como app"
            class="rounded-md px-2 py-1.5 font-medium text-gray-300 transition-colors hover:bg-gray-800 hover:text-white"
          >
            📲 Instalar app
          </button>
        }
        <button
          type="button"
          (click)="registrar()"
          class="rounded-md bg-green-600 px-3 py-1.5 font-semibold text-white transition-colors hover:bg-green-700"
        >
          + Registrar
        </button>
        <span class="text-gray-300">
          {{ usuario.nombre }}
          @if (esAdmin()) {
            <span class="ml-1 rounded bg-green-600 px-1.5 py-0.5 text-xs font-semibold text-white"
              >ADMIN</span
            >
          }
        </span>
        <button
          type="button"
          (click)="cerrarSesion()"
          class="rounded-md border border-gray-700 px-3 py-1.5 font-medium text-gray-300 transition-colors hover:bg-gray-800 hover:text-white"
        >
          Cerrar sesión
        </button>
      } @else {
        <a routerLink="/login" class="font-medium text-gray-300 hover:text-white">Iniciar sesión</a>
        <a
          routerLink="/registro"
          class="rounded-md bg-green-600 px-3 py-1.5 font-semibold text-white transition-colors hover:bg-green-700"
          >Crear cuenta</a
        >
      }
    </div>
  </nav>
</header>

<!-- Con sesión, en celular se deja espacio abajo para la barra de pestañas -->
<main class="max-w-6xl mx-auto px-4 py-8 lg:pb-8" [class.pb-28]="usuario()">
  <router-outlet></router-outlet>
</main>

@if (usuario()) {
  <app-navegacion-movil />
  <!-- Se descarga cuando el navegador queda libre: no pesa en la primera carga y ya está listo al tocar "+" -->
  @defer (on idle) {
    <app-registro-rapido />
  }
}

<!-- Diálogos de confirmación y notificaciones de toda la app (los abren DialogoService y ToastService) -->
<app-dialogo />
<app-toasts />
