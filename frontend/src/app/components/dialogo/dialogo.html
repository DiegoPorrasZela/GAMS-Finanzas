<dialog
  #dialogo
  role="alertdialog"
  aria-labelledby="dialogo-titulo"
  aria-describedby="dialogo-mensaje"
  (cancel)="alPresionarEsc($event)"
  (click)="alHacerClic($event)"
  class="m-auto w-[calc(100%-2rem)] max-w-md overflow-hidden rounded-2xl border-0 bg-white p-0 text-gray-900 shadow-2xl backdrop:bg-gray-900/50 backdrop:backdrop-blur-[2px] scale-95 opacity-0 transition-all transition-discrete duration-150 open:scale-100 open:opacity-100 starting:open:scale-95 starting:open:opacity-0"
>
  @if (actual(); as d) {
    <div class="flex gap-4 p-6">
      <!-- Ícono según el tono -->
      <span
        class="flex size-11 shrink-0 items-center justify-center rounded-full"
        [class]="
          d.tono === 'peligro'
            ? 'bg-red-100 text-red-600'
            : d.tono === 'aviso'
              ? 'bg-amber-100 text-amber-600'
              : 'bg-green-100 text-green-600'
        "
        aria-hidden="true"
      >
        <svg
          class="size-6"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          @switch (d.tono) {
            @case ('peligro') {
              <path
                d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M10 11v6M14 11v6"
              />
            }
            @case ('aviso') {
              <path
                d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"
              />
              <path d="M12 9v4M12 17h.01" />
            }
            @default {
              <circle cx="12" cy="12" r="10" />
              <path d="M12 16v-4M12 8h.01" />
            }
          }
        </svg>
      </span>

      <div class="min-w-0 flex-1">
        <h2 id="dialogo-titulo" class="text-lg font-semibold text-gray-900">{{ d.titulo }}</h2>
        <p id="dialogo-mensaje" class="mt-1 text-sm whitespace-pre-line text-gray-600">
          {{ d.mensaje }}
        </p>
        @if (d.detalle) {
          <p
            class="mt-3 rounded-md px-3 py-2 text-sm"
            [class]="d.tono === 'peligro' ? 'bg-red-50 text-red-700' : 'bg-amber-50 text-amber-800'"
          >
            {{ d.detalle }}
          </p>
        }
      </div>
    </div>

    <div class="flex flex-col-reverse gap-2 bg-gray-50 px-6 py-4 sm:flex-row sm:justify-end">
      <!-- El foco empieza en la opción segura -->
      <button
        type="button"
        autofocus
        (click)="cancelar()"
        class="rounded-md border border-gray-300 bg-white px-4 py-2 text-sm font-semibold text-gray-700 transition-colors hover:bg-gray-100 focus-visible:ring-2 focus-visible:ring-gray-400 focus-visible:outline-none"
      >
        {{ d.cancelar ?? 'Cancelar' }}
      </button>
      <button
        type="button"
        (click)="aceptar()"
        class="rounded-md px-4 py-2 text-sm font-semibold text-white transition-colors focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:outline-none"
        [class]="
          d.tono === 'peligro'
            ? 'bg-red-600 hover:bg-red-700 focus-visible:ring-red-500'
            : d.tono === 'aviso'
              ? 'bg-amber-600 hover:bg-amber-700 focus-visible:ring-amber-500'
              : 'bg-green-600 hover:bg-green-700 focus-visible:ring-green-500'
        "
      >
        {{ d.confirmar ?? 'Aceptar' }}
      </button>
    </div>
  }
</dialog>
