<!-- Barra de pestañas inferior (solo celular y tablet) -->
<nav
  aria-label="Navegación principal"
  class="fixed inset-x-0 bottom-0 z-30 border-t border-gray-200 bg-white/95 pb-[env(safe-area-inset-bottom)] backdrop-blur lg:hidden"
>
  <div class="mx-auto grid max-w-md grid-cols-5 items-end">
    <a
      routerLink="/"
      routerLinkActive="text-green-600!"
      [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page"
      class="flex flex-col items-center gap-0.5 py-2 text-[11px] font-medium text-gray-500"
    >
      <svg
        class="size-6"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z" />
      </svg>
      Inicio
    </a>

    <a
      routerLink="/movimientos"
      routerLinkActive="text-green-600!"
      ariaCurrentWhenActive="page"
      class="flex flex-col items-center gap-0.5 py-2 text-[11px] font-medium text-gray-500"
    >
      <svg
        class="size-6"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01" />
      </svg>
      Movimientos
    </a>

    <!-- Botón principal: registrar desde cualquier pantalla -->
    <div class="flex justify-center">
      <button
        type="button"
        (click)="registrar()"
        aria-label="Registrar movimiento"
        class="-mt-5 mb-1 flex size-14 items-center justify-center rounded-full bg-green-600 text-white shadow-lg ring-4 ring-white transition-colors hover:bg-green-700 focus-visible:outline-none focus-visible:ring-green-300 active:scale-95"
      >
        <svg
          class="size-7"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <path d="M12 5v14M5 12h14" />
        </svg>
      </button>
    </div>

    <a
      routerLink="/metas"
      routerLinkActive="text-green-600!"
      ariaCurrentWhenActive="page"
      class="flex flex-col items-center gap-0.5 py-2 text-[11px] font-medium text-gray-500"
    >
      <svg
        class="size-6"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <circle cx="12" cy="12" r="9" />
        <circle cx="12" cy="12" r="5" />
        <circle cx="12" cy="12" r="1" />
      </svg>
      Metas
    </a>

    <button
      type="button"
      (click)="menuAbierto.set(true)"
      [attr.aria-expanded]="menuAbierto()"
      class="flex flex-col items-center gap-0.5 py-2 text-[11px] font-medium text-gray-500"
      [class.text-green-600!]="menuAbierto()"
    >
      <svg
        class="size-6"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        aria-hidden="true"
      >
        <path d="M4 6h16M4 12h16M4 18h16" />
      </svg>
      Más
    </button>
  </div>
</nav>

<!-- Hoja "Más": cuenta y secciones menos usadas -->
<dialog
  #hoja
  aria-label="Más opciones"
  (cancel)="alPresionarEsc($event)"
  (click)="alHacerClic($event)"
  class="m-0 mt-auto w-full max-w-none rounded-t-2xl border-0 bg-white p-0 text-gray-900 shadow-2xl backdrop:bg-gray-900/50 backdrop:backdrop-blur-[2px] translate-y-full transition-all transition-discrete duration-200 open:translate-y-0 starting:open:translate-y-full sm:mx-auto sm:max-w-md"
>
  <div class="px-5 pt-3 pb-[max(1.25rem,env(safe-area-inset-bottom))]">
    <div class="mx-auto h-1.5 w-10 rounded-full bg-gray-300" aria-hidden="true"></div>

    @if (usuario(); as usuario) {
      <div class="mt-4 flex items-center gap-3 rounded-xl bg-gray-50 p-3">
        <span
          class="flex size-11 shrink-0 items-center justify-center rounded-full bg-green-600 font-semibold text-white"
          aria-hidden="true"
        >
          {{ iniciales(usuario.nombre) }}
        </span>
        <div class="min-w-0">
          <p class="truncate font-semibold text-gray-900">
            {{ usuario.nombre }}
            @if (esAdmin()) {
              <span class="ml-1 rounded bg-green-600 px-1.5 py-0.5 text-xs font-semibold text-white"
                >ADMIN</span
              >
            }
          </p>
          <p class="truncate text-sm text-gray-500">{{ usuario.email }}</p>
        </div>
      </div>
    }

    <ul class="mt-3 divide-y divide-gray-100">
      @if (sePuedeInstalar()) {
        <li>
          <button
            type="button"
            (click)="instalar()"
            class="flex w-full items-center gap-3 py-3 font-semibold text-green-700"
          >
            <svg
              class="size-5"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect x="6" y="2" width="12" height="20" rx="2" />
              <path d="M12 7v7M9 11l3 3 3-3" />
            </svg>
            Instalar la app en este celular
          </button>
        </li>
      }
      <li>
        <a
          routerLink="/tipo-cambio"
          (click)="cerrarMenu()"
          class="flex items-center gap-3 py-3 font-medium text-gray-800"
        >
          <svg
            class="size-5 text-gray-500"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M7 16 3 12l4-4M3 12h14M17 8l4 4-4 4" />
          </svg>
          Tipo de cambio
        </a>
      </li>
      @if (esAdmin()) {
        <li>
          <a
            routerLink="/admin"
            (click)="cerrarMenu()"
            class="flex items-center gap-3 py-3 font-medium text-gray-800"
          >
            <svg
              class="size-5 text-gray-500"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6Z" />
            </svg>
            Administración
          </a>
        </li>
      }
      <li>
        <a
          routerLink="/acerca"
          (click)="cerrarMenu()"
          class="flex items-center gap-3 py-3 font-medium text-gray-800"
        >
          <svg
            class="size-5 text-gray-500"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="9" />
            <path d="M12 16v-4M12 8h.01" />
          </svg>
          Acerca de GAMS Finanzas
        </a>
      </li>
      <li>
        <button
          type="button"
          (click)="cerrarSesion()"
          class="flex w-full items-center gap-3 py-3 font-medium text-red-600"
        >
          <svg
            class="size-5"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" />
          </svg>
          Cerrar sesión
        </button>
      </li>
    </ul>
  </div>
</dialog>
