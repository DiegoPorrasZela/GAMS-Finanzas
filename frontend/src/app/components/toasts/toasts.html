<!-- aria-live: los lectores de pantalla leen cada notificación nueva sin mover el foco -->
<section
  aria-live="polite"
  aria-label="Notificaciones"
  class="pointer-events-none fixed inset-x-0 bottom-0 z-40 flex flex-col items-center gap-2 p-4 pb-24 sm:inset-x-auto sm:right-0 sm:items-end lg:pb-4"
>
  @for (toast of toasts(); track toast.id) {
    <div
      [attr.role]="toast.tipo === 'error' ? 'alert' : 'status'"
      class="pointer-events-auto flex w-full max-w-sm items-start gap-3 rounded-xl border-l-4 bg-white p-4 shadow-lg ring-1 ring-gray-900/5 transition-all duration-300 ease-out starting:translate-y-3 starting:opacity-0"
      [class]="
        toast.tipo === 'exito'
          ? 'border-green-500'
          : toast.tipo === 'error'
            ? 'border-red-500'
            : 'border-sky-500'
      "
    >
      <span
        class="flex size-6 shrink-0 items-center justify-center rounded-full"
        [class]="
          toast.tipo === 'exito'
            ? 'bg-green-100 text-green-600'
            : toast.tipo === 'error'
              ? 'bg-red-100 text-red-600'
              : 'bg-sky-100 text-sky-600'
        "
        aria-hidden="true"
      >
        <svg
          class="size-4"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          @switch (toast.tipo) {
            @case ('exito') {
              <path d="M20 6 9 17l-5-5" />
            }
            @case ('error') {
              <path d="M18 6 6 18M6 6l12 12" />
            }
            @default {
              <path d="M12 16v-4M12 8h.01" />
            }
          }
        </svg>
      </span>

      <p class="min-w-0 flex-1 pt-0.5 text-sm text-gray-800">{{ toast.texto }}</p>

      <button
        type="button"
        (click)="cerrar(toast.id)"
        aria-label="Cerrar notificación"
        class="-m-1 shrink-0 rounded-md p-1 text-gray-500 transition-colors hover:bg-gray-100 hover:text-gray-700 focus-visible:ring-2 focus-visible:ring-gray-400 focus-visible:outline-none"
      >
        <svg
          class="size-4"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <path d="M18 6 6 18M6 6l12 12" />
        </svg>
      </button>
    </div>
  }
</section>
